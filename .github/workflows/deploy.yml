# Build the Vite app at custom-domain root (VITE_BASE=/) and publish dist/ to the
# gh-pages branch, which GitHub Pages serves at wattxchange.app. Replaces the old
# manual "build locally + push gh-pages" flow so the source of truth is this repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build (root base for custom domain)
        env:
          VITE_BASE: /
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: wattxchange.app
          # peaceiris adds .nojekyll automatically (enable_jekyll defaults false)
